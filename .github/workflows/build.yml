name: Build RAVA audio diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - "diagnostic/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build audio diagnostic firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          command: |
            set -euo pipefail
            idf.py build
            python -m esptool --chip esp32s3 merge_bin -o build/RAVA_AUDIO_DIAGNOSTIC.bin -f raw --flash_mode dio --flash_freq 40m --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/max98357a_audio_test.bin
            python - <<'PY'
            from pathlib import Path
            p = Path("build/RAVA_AUDIO_DIAGNOSTIC.bin")
            b = p.read_bytes()
            assert b[0] == 0xE9, "Not an ESP image"
            assert b[2] == 2, f"Expected DIO header, got {b[2]}"
            print(f"Verified image: {len(b)} bytes; DIO header")
            PY
      - uses: actions/upload-artifact@v4
        with:
          name: RAVA-AUDIO-DIAGNOSTIC
          path: build/RAVA_AUDIO_DIAGNOSTIC.bin
          if-no-files-found: error
